name: cattleya_proj_2

version: '3.8'

services:
  app:
    build: .
    container_name: cattleya_app_1
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=cattleya_db
      - DB_USERNAME=root
      - DB_PASSWORD=Password1
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cattleya_db_1
    restart: always
    command: "--default-authentication-plugin=mysql_native_password"
    environment:
      MYSQL_ROOT_PASSWORD: Password1
      MYSQL_DATABASE: cattleya_db
    ports:
      - "3309:3306"
    volumes:
      - db_data_1:/var/lib/mysql

volumes:
  db_data_1: